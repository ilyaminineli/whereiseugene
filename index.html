<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="still missing">
  <title>where is eugene?</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #101010;
      --foreground: #e8e6e1;
      --muted: #77756f;
      --rule: #292824;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      position: relative;
      width: min(680px, calc(100% - 40px));
      min-height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .status {
      margin-bottom: 42px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .22em;
      text-transform: lowercase;
    }

    .timer {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      gap: 8px;
    }

    .unit {
      flex: 0 0 18%;
      min-width: 0;
    }

    .value {
      display: block;
      font-size: clamp(30px, 6.2vw, 52px);
      line-height: 1.1;
      font-weight: 300;
      letter-spacing: -.065em;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .total {
      width: 100%;
      margin-top: 37px;
      padding-top: 17px;
      border-top: 1px solid var(--rule);
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
    }

    .total-value {
      color: var(--foreground);
      font-size: 15px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    footer {
      position: absolute;
      bottom: 28px;
      color: #77756f;
      font-size: 10px;
      letter-spacing: .16em;
    }

    @media (max-width: 520px) {
      main {
        width: min(100% - 36px, 420px);
      }

      .status {
        margin-bottom: 34px;
      }

      .timer {
        gap: 26px 8px;
      }

      .unit {
        flex-basis: 30%;
      }

      .value {
        font-size: clamp(34px, 10vw, 48px);
      }

      .label {
        margin-top: 7px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="status">still missing</div>

    <section class="timer" aria-label="Time elapsed">
      <div class="unit">
        <span class="value" id="months">0</span>
        <span class="label">months</span>
      </div>
      <div class="unit">
        <span class="value" id="days">0</span>
        <span class="label">days</span>
      </div>
      <div class="unit">
        <span class="value" id="hours">00</span>
        <span class="label">hours</span>
      </div>
      <div class="unit">
        <span class="value" id="minutes">00</span>
        <span class="label">minutes</span>
      </div>
      <div class="unit">
        <span class="value" id="seconds">00</span>
        <span class="label">seconds</span>
      </div>
    </section>

    <div class="total">
      <span class="total-value" id="total-days">0</span>
      <span>total days</span>
    </div>

    <footer>where is eugene?</footer>
  </main>

  <script>
    // 21 May 2026, 17:48 — interpreted in the visitor's local timezone.
    const absenceBegan = new Date(2026, 4, 21, 17, 48, 0);
    const dayLength = 24 * 60 * 60 * 1000;

    const elements = {
      months: document.getElementById("months"),
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds"),
      totalDays: document.getElementById("total-days")
    };

    const pad = value => String(value).padStart(2, "0");

    function getCalendarElapsed(start, end) {
      let cursor = new Date(start);
      let months = 0;

      while (true) {
        const next = new Date(cursor);
        next.setMonth(next.getMonth() + 1);
        if (next > end) break;
        cursor = next;
        months += 1;
      }

      const days = Math.floor((end - cursor) / dayLength);
      cursor.setDate(cursor.getDate() + days);

      return {
        months,
        days,
        remainder: Math.max(0, end - cursor)
      };
    }

    function updateTimer() {
      const now = new Date();
      const elapsed = Math.max(0, now - absenceBegan);
      const { months, days, remainder } = getCalendarElapsed(absenceBegan, now);

      elements.months.textContent = months;
      elements.days.textContent = days;
      elements.hours.textContent = pad(Math.floor(remainder / 3600000));
      elements.minutes.textContent = pad(Math.floor((remainder % 3600000) / 60000));
      elements.seconds.textContent = pad(Math.floor((remainder % 60000) / 1000));
      elements.totalDays.textContent = Math.floor(elapsed / dayLength).toLocaleString();
    }

    updateTimer();
    setInterval(updateTimer, 1000);
  </script>
</body>

</html>
